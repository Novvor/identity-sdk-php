name: Package quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          tools: composer:v2
      - run: composer validate --strict
      - run: find src tests -name "*.php" -print0 | xargs -0 -n1 php -l
      - run: php tests/smoke.php
