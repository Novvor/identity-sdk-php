name: Quality

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        php: ["8.2", "8.3", "8.4", "8.5"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
          coverage: none
      - run: composer config repositories.identity-contracts vcs https://github.com/Novvor/identity-contracts
      - uses: ramsey/composer-install@v3
      - run: composer validate --strict
      - run: composer test
      - run: composer audit
  static-analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          tools: composer:v2
          coverage: none
      - run: composer config repositories.identity-contracts vcs https://github.com/Novvor/identity-contracts
      - uses: ramsey/composer-install@v3
      - run: composer analyse
